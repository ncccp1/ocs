# 推送 tag 时自动构建并创建 GitHub Release（附带用户脚本文件）
# 脚本管理器的自动更新读取的是 main 分支上的 release/ 目录，不依赖这里的 Release，
# 这里的 Release 只是方便手动下载和查看更新日志。

name: Userscript Auto Releases

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" >> $GITHUB_ENV
      - name: Install Dependencies
        run: |
          npm install pnpm -g
          pnpm install -w
          cd packages/scripts
          pnpm install
          cd ../../
          npm run tsc
      # 构建会输出到 dist/，并同步生成 release/ 目录
      - name: Build scripts
        run: npm run build

      - name: Build ChangeLogs
        run: |
          npm run changelog
          npm run changelog:simplify
          npm run changelog:current

      - name: Fetch Change logs
        if: runner.os == 'Linux'
        run: |
          echo "pwd: $(pwd)"
          echo "files:"
          ls -la
          echo "Displaying CHANGELOG_CURRENT.md content:"
          cat CHANGELOG_CURRENT.md
          if [ -f "CHANGELOG_CURRENT.md" ]; then
            CHANGE_LOGS=$(cat CHANGELOG_CURRENT.md)
            echo "CHANGE_LOGS<<EOF" >> $GITHUB_ENV
            echo "$CHANGE_LOGS" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "CHANGELOG_CURRENT.md file not found"
          fi
        shell: bash
      - name: Generate release.txt
        if: runner.os == 'Linux'
        run: |
          if [ -z "$CHANGE_LOGS" ]; then
            echo "No change logs found, using default message"
            CHANGE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found change logs"
          fi

          cat > release.txt << EOF
          $CHANGE_LOGS

          ## 资源下载列表

          - [用户脚本](${{ env.DOWNLOAD_URL }}nanchengpai.user.js)
          - [用户脚本(全域名通用版)](${{ env.DOWNLOAD_URL }}nanchengpai.common.user.js)
          - [简洁更新日志](${{ env.DOWNLOAD_URL }}CHANGELOG_SIMPLIFIED.md)

          ### 快捷访问
          - [项目主页](https://github.com/${{ github.repository }})

          Created at ${{ env.BUILDTIME }}.
          EOF

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifactContentType: "html/text"
          artifacts: "./release/nanchengpai.user.js,./release/nanchengpai.common.user.js,./CHANGELOG_SIMPLIFIED.md"
          bodyFile: "./release.txt"
